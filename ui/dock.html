<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lamplit dock</title>
  <link rel="stylesheet" href="dock/dock.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <!-- The button symbols for the hints, the same as index.html's (tests/dock.mjs checks they stay the same). -->
    <symbol id="btn-cross" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g></symbol>
    <symbol id="btn-circle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="6.5"/></g></symbol>
    <symbol id="btn-adjust" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M8.5 8.5 5 12l3.5 3.5M15.5 8.5 19 12l-3.5 3.5"/></g></symbol>
    <!-- Up and Down on the d-pad, for the hints. -->
    <symbol id="btn-up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18.5V5.5M6.8 10.7 12 5.5l5.2 5.2"/></g></symbol>
    <symbol id="btn-down" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13M6.8 13.3 12 18.5l5.2-5.2"/></g></symbol>
    <!-- The dock's icons, on the same grid. -->
    <symbol id="i-resume" viewBox="0 0 24 24"><path fill="currentColor" d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></g></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="1.6"/><path d="M8.5 20h7"/></g></symbol>
    <symbol id="i-headset" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 15v-3a7.5 7.5 0 0 1 15 0v3"/><rect x="3.5" y="13.5" width="4" height="6.5" rx="1.6"/><rect x="16.5" y="13.5" width="4" height="6.5" rx="1.6"/></g></symbol>
    <symbol id="i-controller" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 7h9a4.4 4.4 0 0 1 4.3 3.5l1 5a2.5 2.5 0 0 1-4.4 2.1L15.6 16H8.4l-1.8 1.6a2.5 2.5 0 0 1-4.4-2.1l1-5A4.4 4.4 0 0 1 7.5 7z"/><path d="M8 10v3.4M6.3 11.7h3.4M15.5 10.6h.01M17.6 12.6h.01"/></g></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><path d="M12 7.5h.01"/></g></symbol>
    <symbol id="i-quiet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g></symbol>
    <symbol id="i-quiet-on" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19v-6M10 19V6M15 19v-9M20 19v-4"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M6.5 9.5v10h11v-10"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" d="M6 12.5l4 4L18.5 8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3.8v7.4"/><path d="M7.2 6.6a7.5 7.5 0 1 0 9.6 0"/></g></symbol>
  </svg>

  <!-- The island: a pill on the bottom edge of the screen that springs open into the dock (#dock), or widens to show
       news (#news). Behind both, the game's own art, blurred (#backdrop) and darkened (.tint). dock.css lays the faces
       out from the bottom centre; main.js sizes the island to the one showing, and moves the focus ring (#ring). -->
  <!-- Home: a veil in the game's colours over the whole screen, which the home screen comes forward behind. -->
  <div id="veil" aria-hidden="true"></div>
  <!-- The island's shadow, a layer of its own: folding, the island is clipped into the pill, which would cut it off. -->
  <div id="shade" data-mode="gone" aria-hidden="true"></div>
  <div id="island" data-mode="gone">
    <canvas id="backdrop" width="160" height="90" aria-hidden="true"></canvas>
    <div class="tint" aria-hidden="true"></div>
    <div id="news" class="face"><span class="badge"><svg class="icon" aria-hidden="true"><use id="newsIcon" href="#i-controller"/></svg></span><span id="newsText"></span></div>
    <div id="dock" class="face" role="dialog" aria-label="Dock">
      <header id="top">
        <img id="cover" alt="" crossorigin="anonymous">
        <div id="title"><span id="game"></span><span id="session"></span></div>
        <div id="volume" class="slot"><svg class="icon" aria-hidden="true"><use id="volumeIcon" href="#i-volume"/></svg><span class="bar"><i id="volumeFill"></i></span><span id="volumeText"></span></div>
        <span id="chips"></span>
        <span id="clock"></span>
      </header>
      <div id="tiles"></div>
      <div id="outputs" hidden><h3>Sound output</h3><div id="outputList"></div></div>
      <p id="message"></p>
      <footer id="hint"></footer>
      <div id="ring" aria-hidden="true"></div>
    </div>
    <div class="rim" aria-hidden="true"></div>
  </div>

  <script type="module" src="dock/main.js"></script>
</body>
</html>
