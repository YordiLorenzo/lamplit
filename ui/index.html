  <div id="stage">
    <div class="hero" id="heroA"></div>
    <div class="hero" id="heroB"></div>
    <div class="shade"></div>
  </div>

  <header id="info">
    <img id="logo" alt="">
    <h1 id="title"></h1>
    <div id="meta">
      <span id="store" class="pill"></span>
      <span id="note" class="pill quiet"></span>
      <span id="played"></span>
      <span id="playtime"></span>
    </div>
  </header>

  <div id="clock"></div>
  <div id="empty">Looking for games…</div>

  <div id="overlay">
    <div class="spinner"></div>
    <div id="overlayTitle"></div>
    <div id="overlaySub"></div>
    <ul id="steps"></ul>
  </div>

  <div id="filters"></div>
  <main id="row"><div id="track"></div><div id="noMatch" hidden>No games match</div></main>

  <!-- A game's menu (library.js, lift.js): the focused cover lifted over the blurred screen, the menu or Change art
       (art.js) beside it. -->
  <div id="lift">
    <div class="veil"></div>
    <div id="card">
      <div class="shadow"></div>
      <div class="glow"></div>
      <div id="face"><div class="name"></div><div class="sheen"></div></div>
    </div>
    <aside id="details" class="sheet">
      <h2 id="dName"></h2>
      <dl>
        <dt>Store</dt><dd id="dStore"></dd>
        <dt>Last played</dt><dd id="dPlayed"></dd>
        <dt>Play time</dt><dd id="dTime"></dd>
        <dt>Folder</dt><dd id="dDir"></dd>
      </dl>
      <div id="dChoices"></div>
    </aside>
    <aside id="artPick" class="sheet">
      <h2>Change art</h2>
      <div id="artField" class="field" data-id="search"><svg class="glass" aria-hidden="true"><use href="#i-search"/></svg><span id="artQuery" class="typed"></span></div>
      <div id="artKeys" class="keys"></div>
      <div id="artStatus"></div>
      <div id="artTiles"></div>
      <div id="artChoices" class="choices"></div>
    </aside>
  </div>

  <!-- Settings and Add a game share one plate (settings.js, add.js, morph.js): each is a face of it, and the plate
       widens for Add a game. -->
  <aside id="settings" class="panel">
    <section id="settingsFace" class="face">
      <h2 id="settingsTitle">Settings</h2>
      <div id="settingsList"></div>
    </section>
    <section id="add" class="face">
      <h2 id="addTitle">Add a game</h2>
      <div id="addPath"></div>
      <div id="addList"></div>
      <div id="addField" class="field"><span id="addName" class="typed" data-placeholder="The game's name"></span></div>
      <div id="addKeys" class="keys"></div>
    </section>
  </aside>

  <aside id="find" class="panel">
    <h2>Find a game</h2>
    <div id="findField"><svg class="glass" aria-hidden="true"><use href="#i-search"/></svg><span id="findQuery" data-placeholder="A name, or its first letters"></span></div>
    <div id="findKeys"></div>
    <h3>Store</h3>
    <div id="findStores" class="choices"></div>
    <h3>Sort</h3>
    <div id="findSort" class="choices"></div>
  </aside>

  <div id="toast"></div>
  <!-- Black between the starting screen and the game's window (launch.js handOver). -->
  <div id="arrival"></div>
  <div id="curtain"></div>
  <footer id="hint"></footer>

  <script type="module" src="main.js"></script>
</body>
</html>
