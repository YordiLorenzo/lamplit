name: Bug report
description: Something in Lamplit doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the open issues first, in case someone has reported it already. One problem per report helps.
        For a security problem, follow [SECURITY.md](https://github.com/YordiLorenzo/lamplit/blob/main/SECURITY.md) instead, so the report stays private.

  - type: input
    id: lamplit-version
    attributes:
      label: Lamplit version
      description: >-
        Save a report shows it on the Lamplit line. Windows Settings > Apps > Installed apps also shows it under Lamplit.
      placeholder: 0.4.0
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Copy the Windows line from Save a report, or press Win+R, type `winver` and copy the version and OS build.
      placeholder: Windows 11 25H2, OS build 26200.6584
    validations:
      required: true

  - type: dropdown
    id: controller
    attributes:
      label: Controller
      description: What you used when it happened.
      options:
        - DualSense
        - DualSense Edge
        - Keyboard and mouse
        - Another controller (write which one below)
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: How the controller is connected
      options:
        - USB cable
        - Bluetooth
        - Doesn't apply (keyboard and mouse)
    validations:
      required: true

  - type: dropdown
    id: stores
    attributes:
      label: Store
      description: The store of the game it happened with, if it has to do with a game.
      multiple: true
      options:
        - Steam
        - Epic Games Launcher
        - EA app
        - Ubisoft Connect
        - Rockstar Games Launcher
        - GOG Galaxy
        - Xbox app
        - A game outside any store
        - Not about a game

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you did, step by step, what you expected, and what Lamplit did instead. For a game Lamplit doesn't find,
        name its store and its install folder.
      placeholder: |
        1. Started a game from Epic with Cross.
        2. Quit the game from its own menu.
        I expected Lamplit to come back to the front. The Windows desktop showed instead.
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Lamplit report
      description: |
        In Lamplit, open Settings > System > Save a report. Read the preview, then choose Save.
        Attach the `Lamplit report ...txt` file from Downloads here. It includes versions, screen and device details, stores, selected settings and the last 50 warnings and errors.
        It removes paths, account and device names, and replaces current library game names with ids. Nothing is sent until you attach it.
        If Lamplit cannot open, say so here and attach a log below instead.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Raw logs (optional)
      description: |
        Lamplit writes its logs to `%LOCALAPPDATA%\lamplit\`. To open that folder, press Win+R, paste `%LOCALAPPDATA%\lamplit` and press Enter.
        If the report is not enough, attach `lamplit.log` here. For Steam repair or old sign-in task removal, attach `setup.log` from the account that ran the helper. Attach `restore.log` for uninstall or command-line restoration, and `supervisor.log` when Lamplit closed by itself.
        The logs name your games, devices and folders, and a folder path can include your Windows user name. Read them first and remove anything you don't want to share.
    validations:
      required: false

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a photo of the TV, which headset you use, or what you already tried.
    validations:
      required: false
