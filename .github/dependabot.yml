version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # windows and windows-core stay on the version Tauri uses (see Cargo.toml), so they move when Tauri does.
      - dependency-name: windows
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: windows-core
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
